case: ieee14
backend: pypower_ac
seed: 0
alpha: 0.1
max_generations: 10

powerflow:
  rate_a_mode: scaled_from_base_flow
  rate_a_scale: 1.15
  min_rate_a_mw: 20.0
  default_rate_a_mw: 100.0
  use_original_rate_a: false

chronics:
  type: surrogate_week
  resolution_minutes: 5
  days: 7
  load_daily_variation: true
  load_weekly_variation: true
  wind_variation: true

initial_outages:
  mode: sampled
  include_n_minus_1: true
  include_common_bus_n_minus_2: true
  fixed: []

ppo:
  total_steps: 60000
  learning_rate: 1.0e-3
  gamma: 1.0
  gae_lambda: 0.95
  entropy_coef: 0.01
  clip_range: 0.2
  value_clip: 0.2
  n_steps: 1024
  batch_size: 256
  epochs: 10
  policy_hidden_layers: [64, 64]
  value_hidden_layers: [64, 8]
  use_action_mask: true
  use_do_nothing_pretrain: true
  deterministic_eval: false

pretrain:
  enabled: true
  n_states: 2048
  epochs: 5
  entropy_coef: 0.01
  target_do_nothing_prob: 0.60

oracle_bc:
  enabled: false
  use_for_ppo_init: false
  mode: full
  train_split_scan: results/rl_mitigation/ieee14/action_value_scan/train_action_value_scan.csv
  train_scenarios: results/rl_mitigation/ieee14/scenarios/train_scenarios_seed0_episodes300.json
  min_improvement: 1.0
  entropy_coef: 0.01
  epochs: 30
  learning_rate: 1.0e-3

safe_policy:
  active_prob_threshold: 0.35
  margin_threshold: 0.05
  tune_on_val: true
  active_prob_grid: [0.20, 0.30, 0.35, 0.40, 0.50]
  margin_grid: [0.00, 0.05, 0.10, 0.20]

figures:
  survival_yscale: linear
