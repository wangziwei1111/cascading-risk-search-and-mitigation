case: ieee118
backend: pypower_ac
seed: 0
alpha: 0.1
max_generations: 20
powerflow:
  rate_a_mode: scaled_from_base_flow
  rate_a_scale: 1.15
  min_rate_a_mw: 20.0
  default_rate_a_mw: 100.0
  use_original_rate_a: false
initial_outages:
  mode: sampled
  include_n_minus_1: false
  include_common_bus_n_minus_2: true
  k_values: [2, 3, 4]
  motif_types: [star]
chronics:
  type: surrogate_week
  resolution_minutes: 5
  days: 7
ppo:
  total_steps: 600000
  learning_rate: 1.0e-4
  gamma: 1.0
  gae_lambda: 0.95
  entropy_coef: 0.01
  clip_range: 0.3
  value_clip: 0.3
  n_steps: 1024
  batch_size: 256
  epochs: 10
  policy_hidden_layers: [256, 256]
  value_hidden_layers: [64, 8]
  use_action_mask: true
  use_do_nothing_pretrain: true
pretrain:
  n_states: 2048
  epochs: 5
  entropy_coef: 0.01
  target_do_nothing_prob: 0.60
