case: ieee14
backend: pypower_ac
seed: 0
steps_per_setting: 1024
powerflow:
  rate_a_mode: scaled_from_base_flow
  rate_a_scale: 1.15
  min_rate_a_mw: 20.0
  default_rate_a_mw: 100.0
  use_original_rate_a: false
initial_outages:
  mode: sampled
  include_n_minus_1: true
  include_common_bus_n_minus_2: true
  fixed: []
grid:
  learning_rate: [0.001, 0.0001, 0.00001]
  entropy_coef: [0.1, 0.01, 0.001]
ppo:
  gamma: 1.0
  gae_lambda: 0.95
  clip_range: 0.2
  value_clip: 0.2
  n_steps: 1024
  batch_size: 256
  epochs: 10
  policy_hidden_layers: [64, 64]
  value_hidden_layers: [64, 8]
  use_action_mask: true
